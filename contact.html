<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | LENCOIS</title>
  <meta name="description" content="LENCOISへの連絡先です。" />
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="assets/css/style.css?v=contact-product-20261106" />
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="wordmark wordmark--logo" href="index.html" aria-label="LENCOIS ホーム">
        <img src="assets/images/brand/lencois-logo.svg" alt="LENCOIS" width="566.93" height="127.56" />
      </a>
      <button class="nav-toggle" aria-label="メニューを開く" aria-expanded="false">
        <span></span>
      </button>
      <nav class="site-nav">
        <a href="index.html">Home</a>
        <a href="work.html">Work</a>
        <a href="blog.html">Blog</a>
        <a href="contact.html" aria-current="page">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="page-header container">
      <h1>Contact</h1>
      <p>アプリや作品についてのお問い合わせ、ご感想はこちらまで。</p>
    </div>

    <section class="container">
      <form id="contact-form" class="contact-form" aria-describedby="contact-status contact-privacy">
        <fieldset disabled>
          <legend class="contact-form-title">お問い合わせフォーム</legend>
          <label for="contact-name">お名前 <span>必須</span></label>
          <input id="contact-name" name="name" autocomplete="name" maxlength="80" required />
          <label for="contact-email">メールアドレス <span>必須</span></label>
          <input id="contact-email" name="email" type="email" autocomplete="email" maxlength="254" required />
          <label for="contact-product">お問い合わせ対象 <span>必須</span></label>
          <select id="contact-product" name="product" required>
            <option value="">選択してください</option>
            <option value="digbox">DIGBOX</option>
            <option value="other">その他</option>
          </select>
          <label for="contact-subject">件名 <span>必須</span></label>
          <input id="contact-subject" name="subject" maxlength="120" required />
          <label for="contact-message">お問い合わせ内容 <span>必須</span></label>
          <textarea id="contact-message" name="message" rows="7" maxlength="5000" aria-describedby="contact-message-hint" required></textarea>
          <p id="contact-message-hint" class="contact-note">5,000文字まで。不具合のご報告は、アプリ名・ご利用の端末・発生した状況を添えてください。</p>
          <div class="contact-trap" aria-hidden="true"><label for="contact-website">Website</label><input id="contact-website" name="website" tabindex="-1" autocomplete="off" /></div>
          <div id="contact-verification"></div>
          <button class="contact-submit" type="submit" disabled>送信する</button>
        </fieldset>
        <p id="contact-status" role="status" aria-live="polite">フォームを読み込んでいます。表示されない場合は、時間をおいて再読み込みしてください。</p>
        <noscript><p>フォームを利用するにはJavaScriptを有効にしてください。</p></noscript>
        <p id="contact-privacy" class="contact-note">入力内容はお問い合わせへの対応に使用します。送信・迷惑投稿対策にCloudflareを利用し、内容は管理者のメールへ届きます。パスワードや決済情報は入力しないでください。</p>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="site-footer__inner">
      <span>&copy; 2026 LENCOIS</span>
      <a href="contact.html">Contact</a>
    </div>
  </footer>

  <script src="assets/js/contact-config.js?v=20261106-connected"></script>
  <script src="assets/js/contact.js?v=form-only-20261106"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
